<!doctype html>
<html lang="en" data-report-responsive="1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><!-- REPORT:TITLE --></title>
<style>
  .report-root {
    --surface:#fcfcfb; --page:#f4f4f1; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --line:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --accent:#2a78d6; --accent2:#256abf; --good:#0ca30c; --warning:#d58b00;
    --critical:#d03b3b; --deep:#2c2c2a; --serif:Georgia,'Times New Roman',serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .report-root { --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
      --muted:#898781; --line:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --accent:#3987e5; --accent2:#76aef0; --deep:#000; }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--page); }
  .report-root { min-height:100vh; padding:28px 24px 84px; color:var(--ink); font-family:var(--sans); }
  .wrap { width:min(3000px,calc(100vw - 2 * clamp(12px,2.2vw,48px))); margin:0 auto; container-type:inline-size; container-name:report; }
  .surface { background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:0 1px 2px rgba(11,11,11,.04),0 8px 24px -12px rgba(11,11,11,.12); }
  .masthead { padding:28px 30px; }
  .eyebrow,.label { font:600 10px/1.4 var(--mono); text-transform:uppercase; letter-spacing:.11em; color:var(--muted); }
  h1,h2,h3,p { margin-top:0; }
  h1 { margin-bottom:8px; font:600 clamp(32px,5vw,48px)/1.04 var(--serif); letter-spacing:-.028em; }
  .standfirst { margin:0; max-width:820px; font:italic 18px/1.55 var(--serif); color:var(--ink2); white-space:pre-line; }
  .meta { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    margin-top:22px; padding-top:17px; border-top:1px solid var(--line); }
  .stats { display:flex; gap:24px; flex-wrap:wrap; }
  .stat { min-width:98px; }
  .stat strong { display:block; font:600 25px/1 var(--serif); }
  .stat span { font:9px/1.5 var(--mono); text-transform:uppercase; letter-spacing:.09em; color:var(--muted); }
  .hero { margin-top:18px; padding:20px 24px; border-left:4px solid var(--good); }
  .hero a { color:var(--ink); text-decoration:none; font:600 23px/1.2 var(--serif); }
  .hero p { margin:7px 0 0; color:var(--ink2); font:italic 15px/1.55 var(--serif); }
  .ledger { margin-top:18px; padding:20px 24px; }
  .ledger h2,.performance h2 { margin:0 0 12px; font:600 11px/1.4 var(--mono); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  .candidate { display:grid; grid-template-columns:68px minmax(0,1fr); margin-top:22px; overflow:hidden;
    content-visibility:auto; contain-intrinsic-size:1px 760px; }
  .rail { display:flex; flex-direction:column; align-items:center; gap:8px; padding:22px 8px;
    border-right:1px solid var(--line); text-decoration:none; color:var(--ink); background:color-mix(in srgb,var(--accent) 7%,var(--surface)); }
  .rail [data-rank] { font:600 43px/1 var(--serif); }
  .rail .vertical { writing-mode:vertical-rl; font:9px/1 var(--mono); letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .body { padding:24px 26px 28px; min-width:0; }
  .candidate h2 { margin:0; font:600 25px/1.18 var(--serif); letter-spacing:-.016em; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:3px 8px; font:10px/1.4 var(--mono); color:var(--ink2); }
  .meter { margin-top:16px; max-width:620px; }
  .files { margin:16px 0 0; font:11px/1.6 var(--mono); color:var(--ink2); overflow-wrap:anywhere; }
  .transform { display:grid; grid-template-columns:minmax(0,1fr) 42px minmax(0,1fr); align-items:stretch;
    gap:12px; margin-top:20px; padding:16px; border:1px solid var(--line); border-radius:12px; background:var(--page); }
  .side { border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; background:var(--surface); }
  .side.deep { background:var(--deep); color:#fff; border-color:transparent; }
  .side h3 { margin:0 0 10px; font:600 11px/1.4 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .side.deep h3 { color:#c3c2b7; }
  .module { padding:7px 9px; margin-top:6px; border:1px solid var(--line); border-radius:7px; font:11px/1.35 var(--mono); overflow-wrap:anywhere; }
  .deep .module { border-color:#52514e; color:#fff; }
  .interface { margin:8px 0; padding:8px; border:1px dashed var(--accent); border-radius:7px; font:600 11px/1.4 var(--mono); color:inherit; }
  .note { margin:10px 0 0; font:13px/1.5 var(--serif); color:var(--ink2); white-space:pre-line; }
  .deep .note { color:#d8d7d0; }
  .arrow { align-self:center; justify-self:center; display:grid; place-items:center; width:30px; height:30px;
    border-radius:50%; background:var(--accent); color:#fff; font:700 18px/1 var(--sans); }
  .explain { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:18px; padding-top:18px; border-top:1px solid var(--line); }
  .explain p { margin:4px 0 0; font:15px/1.55 var(--serif); color:var(--ink2); white-space:pre-line; }
  .wins { display:flex; gap:8px 16px; flex-wrap:wrap; margin:16px 0 0; padding:0; list-style:none; }
  .wins li { font:11px/1.4 var(--mono); color:var(--ink2); }
  .wins li::before { content:'+ '; color:var(--good); font-weight:700; }
  .adr { margin-top:16px; padding:10px 12px; border-left:3px solid var(--warning); background:color-mix(in srgb,var(--warning) 8%,transparent);
    font:12px/1.5 var(--mono); color:var(--ink2); }
  .performance { margin-top:22px; padding:18px 22px; content-visibility:auto; contain-intrinsic-size:1px 240px; }
  .performance pre { margin:0; white-space:pre-wrap; overflow:auto; max-height:320px; font:10px/1.55 var(--mono); color:var(--ink2); }
  .verification { margin-top:22px; padding:18px 22px; }
  .problems { margin:10px 0 0; padding-left:18px; }
  footer { margin-top:28px; padding-top:14px; border-top:1px solid var(--line); font:10px/1.5 var(--mono); color:var(--muted); }
  @media(max-width:760px) {
    .report-root { padding:16px 12px 60px; }
    .masthead,.body { padding:20px; }
    .candidate { grid-template-columns:48px minmax(0,1fr); }
    .rail [data-rank] { font-size:32px; }
    .transform { grid-template-columns:1fr; }
    .arrow { transform:rotate(90deg); }
    .explain { grid-template-columns:1fr; }
  }
  @media print { .candidate,.performance { content-visibility:visible; contain-intrinsic-size:auto; } }
  /* REPORT:SHARED_PRESENTATION_CSS */
</style>
</head>
<body>
<div class="report-root">
<main class="wrap rp-shell">
  <header class="surface masthead">
    <div class="eyebrow">Deepening opportunities · architecture review</div>
    <h1><!-- REPORT:REPOSITORY_NAME --></h1>
    <p class="standfirst"><!-- REPORT:STANDFIRST --></p>
    <div class="meta">
      <div class="stats">
        <div class="stat"><strong data-stat-candidates>—</strong><span>candidates</span></div>
        <div class="stat"><strong data-stat-strong>—</strong><span>strong</span></div>
        <div class="stat"><strong data-stat-top>—</strong><span>top priority</span></div>
      </div>
      <span data-verify-chip></span>
    </div>
  </header>

  <!-- REPORT:TOP_RECOMMENDATION -->

  <section class="surface ledger"><h2>Quantitative dashboard</h2><div class="rp-chart-grid"><!-- REPORT:RESPONSIVE_ANALYTICS --></div></section>

  <section class="surface ledger">
    <h2>Ranked candidate ledger</h2>
    <div data-score-legend></div>
    <div data-ledger></div>
  </section>

  <section id="candidates"><!-- REPORT:CANDIDATE_CARDS --></section>

  <section class="surface performance">
    <h2>Performance receipt</h2>
    <pre><!-- REPORT:PERFORMANCE_RECEIPT --></pre>
  </section>

  <section class="surface verification">
    <div class="label">Verification</div>
    <ul class="problems" data-verify-problems></ul>
  </section>

  <footer>Architecture assessment · read-only · zero-network report · every score and rank recomputed from the canonical ledger</footer>
</main>
</div>
<script type="application/json" id="ledger"><!-- REPORT:LEDGER --></script>
<script>/* REPORT:LEDGER_VERIFY */</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var verified = LedgerVerify.runLedger({});
    var set = function (selector, value) { var el = document.querySelector(selector); if (el) el.textContent = value; };
    set("[data-stat-candidates]", verified.candidates.length);
    set("[data-stat-strong]", verified.candidates.filter(function (c) { return c.band && c.band.key === "strong"; }).length);
    set("[data-stat-top]", verified.candidates.length ? verified.candidates[0].computed.priority : "—");
  });
</script>
<script>/* REPORT:SHARED_PRESENTATION_SCRIPT */</script>
</body>
</html>
